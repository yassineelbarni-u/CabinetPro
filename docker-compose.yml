version: '3.8'

services:
  cabinet_postgres:
    image: postgres:16-alpine
    container_name: cabinet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cabinetpro
      POSTGRES_USER: cabinet_admin
      POSTGRES_PASSWORD: cabinet_secure_2026
    ports:
      - "5433:5432"
    volumes:
      - cabinet_pg_data:/var/lib/postgresql/data
      - ./server/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet_admin -d cabinetpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  cabinet_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cabinet_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cabinetpro.ma
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      cabinet_postgres:
        condition: service_healthy

volumes:
  cabinet_pg_data:
